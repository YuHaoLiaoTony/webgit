<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b" id="themeColor">
  <title>WebGit</title>
  <script>
    // Prevent flash - apply theme immediately
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeColor')?.setAttribute('content', '#f8f9fa');
      }
    })();
  </script>
  <!--
    External fonts: Google Fonts are loaded from CDN.
    For production: Consider self-hosting fonts to eliminate external dependencies
    and enable Subresource Integrity (SRI) validation.
    Google Fonts dynamically generates CSS, preventing reliable SRI implementation.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 3v6m0 6v6"/>
          </svg>
        </div>
        <span class="logo-text">WebGit</span>
      </div>

      <div class="branch-selector" id="branchSelector">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 3v12"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="6" r="3"/>
          <path d="M18 9a9 9 0 01-9 9"/>
        </svg>
        <span class="branch-name" id="currentBranch">main</span>
        <div class="sync-info" id="syncInfo"></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>

      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>

        <button class="menu-toggle" id="menuToggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav" id="mainNav">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="#" class="nav-link active" data-view="status">
          <div class="nav-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            <span class="badge" id="changesBadge" style="display: none;">0</span>
          </div>
          Changes
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" data-view="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          History
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" data-view="branches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3v12"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="6" r="3"/>
            <path d="M18 9a9 9 0 01-9 9"/>
          </svg>
          Branches
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" data-view="remotes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
          Remotes
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <!-- Status View -->
    <div class="view active" id="statusView">
      <div id="statusContent">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- History View -->
    <div class="view" id="historyView">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Commit History
          </h2>
        </div>
        <ul class="commit-list" id="commitList">
          <div class="loading">
            <div class="spinner"></div>
          </div>
        </ul>
      </div>
    </div>

    <!-- Branches View -->
    <div class="view" id="branchesView">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 3v12"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="6" r="3"/>
              <path d="M18 9a9 9 0 01-9 9"/>
            </svg>
            Local Branches
          </h2>
          <button class="btn btn-primary btn-sm" id="newBranchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            New
          </button>
        </div>
        <ul class="branch-list" id="branchList">
          <div class="loading">
            <div class="spinner"></div>
          </div>
        </ul>
      </div>
    </div>

    <!-- Remotes View -->
    <div class="view" id="remotesView">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
            </svg>
            Remote Repositories
          </h2>
        </div>
        <div class="card-content" id="remotesContent">
          <div class="loading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Commit Details View -->
    <div class="view" id="commitDetailView">
      <div class="card">
        <div class="card-header">
          <button class="btn btn-secondary btn-sm" id="backToHistory">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
          </button>
          <h2 class="card-title" id="commitDetailTitle">Commit Details</h2>
        </div>
        <div class="card-content" id="commitDetailContent">
          <div class="loading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Branch Modal -->
  <div class="modal-overlay" id="branchModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="branchModalTitle">Switch Branch</h3>
        <button class="modal-close" id="closeBranchModal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-content" id="branchModalContent">
        <!-- Branch list or new branch form -->
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="confirmModalTitle">Confirm</h3>
        <button class="modal-close" id="closeConfirmModal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-content">
        <div class="confirm-dialog">
          <p class="confirm-dialog-message" id="confirmMessage">Are you sure?</p>
          <div class="confirm-dialog-actions">
            <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
            <button class="btn btn-danger" id="confirmOk">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/status.js"></script>
  <script src="js/history.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/remotes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
